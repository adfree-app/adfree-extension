name: ci

# This repository is only ever built here and in a browser: the app and the
# website live in their own repositories, and neither of them compiles this. So
# the check is narrow and the release is the point — a tag publishes the zip
# that the website's install page and anybody's "load unpacked" point at.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: build
        run: bun run build

      # A manifest that names a file the build did not produce, or a tag whose
      # manifest disagrees with its own version, is a release that installs
      # nothing and says it did.
      - name: the bundle a browser accepts
        run: bun run verify

      - name: pack
        run: |
          cd dist/chrome && zip -r "$GITHUB_WORKSPACE/adfree-extension-chrome.zip" .
          cd ../firefox && zip -r "$GITHUB_WORKSPACE/adfree-extension-firefox.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: adfree-extension
          path: adfree-extension-*.zip

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            adfree-extension-chrome.zip
            adfree-extension-firefox.zip
          generate_release_notes: true
